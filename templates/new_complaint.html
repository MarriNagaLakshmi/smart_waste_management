{% extends 'base.html' %}{% block title %}Report an issue{% endblock %}{% block content %}<div class="page-heading"><div><p class="eyebrow">HELP YOUR STREET</p><h1>Report a waste issue</h1><p>Share the details so the collection team can find and assess it.</p></div></div><form class="panel complaint-form" method="post" enctype="multipart/form-data"><div class="form-grid"><label>Waste category<select name="category" required><option value="">Choose category</option>{% for x in ['Overflowing bin','Missed collection','Illegal dumping','Recyclables','Street litter','Other'] %}<option>{{ x }}</option>{% endfor %}</select></label><label>Exact location<input name="location" placeholder="Street, landmark or area" required></label><label class="full">Description<textarea name="description" rows="5" placeholder="What happened? Include nearby landmarks if useful." required></textarea></label><label>Photo (optional)<input type="file" name="image" accept="image/png,image/jpeg,image/webp"></label><div class="location-tools"><button type="button" class="button outline" id="locate">Use my location</button><span id="location-status">Location can also be entered manually.</span></div><input type="hidden" name="latitude" id="latitude"><input type="hidden" name="longitude" id="longitude"></div><div class="form-actions"><a class="text-link" href="/dashboard">Cancel</a><button class="button dark" type="submit">Submit report</button></div></form>{% endblock %}
